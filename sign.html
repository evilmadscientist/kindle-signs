<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Live Text Sign</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				text-align: center;
				margin-top: 80px;
			}
			#h1 {
				font-size: 6em;
				margin-top: 20px;
				font-weight: bold;
			}
			#h2 {
				font-size: 2em;
				margin-top: 20px;
				font-weight: bold;
			}
			#h3 {
				font-size: 1em;
				margin-top: 20px;
			}
		</style>

	</head>
	<body>
		<!-- <div id="h1">H1 text, big</div> -->
		<div id="h2">{{ text }}</div>
		<!-- <div id="h3">H3 text, small</div> -->
		<!-- Add lines to allow for scrolling -->
		<p><br><br><br><br><br></p>

		<script>
			// The div already holds the current text; this keeps it live.
			if (window.EventSource) {
				var source = new EventSource("/stream_text");
				source.onmessage = function (event) {
					document.getElementById("h2").textContent = event.data;
				};
			} else {
				// No EventSource (very old browser): fall back to reloading.
				setTimeout(function () { window.location.reload(); }, 5000);
			}
		</script>
	</body>
</html>
