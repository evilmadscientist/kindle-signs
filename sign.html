<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Live Text Sign</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				text-align: center;
				margin-top: 80px;
			}
			#h1 {
				font-size: 6em;
				margin-top: 20px;
				font-weight: bold;
			}
			#h2 {
				font-size: 2em;
				margin-top: 20px;
				font-weight: bold;
			}
			#h3 {
				font-size: 1em;
				margin-top: 20px;
			}
		</style>

	</head>
	<body>
		<!-- A blank line is hidden so it leaves no gap on the sign. -->
		<div id="h1"{% if not h1 %} style="display:none"{% endif %}>{{ h1 }}</div>
		<div id="h2"{% if not h2 %} style="display:none"{% endif %}>{{ h2 }}</div>
		<div id="h3"{% if not h3 %} style="display:none"{% endif %}>{{ h3 }}</div>
		<!-- Add lines to allow for scrolling -->
		<p><br><br><br><br><br></p>

		<script>
			// The divs already hold the current text; this keeps them live.
			function setLine(id, value) {
				var el = document.getElementById(id);
				el.textContent = value;
				el.style.display = value ? "" : "none";
			}

			if (window.EventSource) {
				var source = new EventSource("/stream_text");
				source.onmessage = function (event) {
					var lines = JSON.parse(event.data);
					setLine("h1", lines.h1);
					setLine("h2", lines.h2);
					setLine("h3", lines.h3);
				};
			} else {
				// No EventSource (very old browser): fall back to reloading.
				setTimeout(function () { window.location.reload(); }, 5000);
			}
		</script>
	</body>
</html>
